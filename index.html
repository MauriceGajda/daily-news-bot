            return `Vor ${diff} Min.`;
        }

        function showNext() {

            bar.offsetHeight; 
            bar.style.animation = 'progress 4s linear forwards';

            status.innerText = entry.is_ai ? `KI-Fokus | ${timeLabel}` : `${entry.source} | ${timeLabel}`;
