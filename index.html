
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; padding: 0; background: transparent; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; height: 85px; }
        #podcast-news-widget { width: 100%; border: 1px solid rgb(255, 236, 192); border-radius: 0px; background: rgb(0, 21, 56); overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.3); height: 85px; box-sizing: border-box; }
        .ticker-header { background: rgb(255, 236, 192); color: rgb(0, 21, 56); padding: 5px 12px; font-weight: bold; font-size: 13px; display: flex; align-items: center; height: 24px; position: relative; overflow: hidden; }
        #header-text-container { position: relative; height: 100%; width: 100%; display: flex; align-items: center; }
        .header-msg { position: absolute; width: 100%; transition: all 0.6s ease; opacity: 0; transform: translateY(10px); }
        .header-msg.active { opacity: 1; transform: translateY(0); }
        .live-dot { height: 6px; width: 6px; background-color: #ff0000; border-radius: 50%; margin-right: 8px; flex-shrink: 0; animation: pulse 2s infinite ease-in-out; }
        #progress-bar-container { width: 100%; height: 3px; background: rgba(0,0,0,0.2); }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(to bottom, rgb(204, 189, 154) 0%, rgb(255, 236, 192) 100%); }
        #feed-box { padding: 4px 12px; height: 38px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .status-tag { color: rgb(255, 236, 192); opacity: 0.5; font-size: 9px; text-transform: uppercase; margin-bottom: 2px; }
        .news-text { color: rgb(255, 236, 192); font-size: 13px; line-height: 1.2; margin: 0; text-decoration: none; font-weight: bold; animation: fadeIn 0.5s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; display: block; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes progress { from { width: 0%; } to { width: 100%; } }
        @media (max-width: 768px) { .news-text { font-size: 15px; } .ticker-header { font-size: 15px; height: 26px; } .header-msg { font-size: 15px; } .status-tag { font-size: 10px; } }
    </style>
</head>
<body>
    <div id="podcast-news-widget">
        <div class="ticker-header">
            <span class="live-dot"></span>
            <div id="header-text-container">
                <span id="h1" class="header-msg active">Talk?Now! News</span>
                <span id="h2" class="header-msg">Aktuelle News aus Medien & Showbiz</span>
            </div>
        </div>
        <div id="progress-bar-container"><div id="progress-bar"></div></div>
        <div id="feed-box">
            <div id="status" class="status-tag"></div>
            <div id="content-container" style="width: 100%;"></div>
        </div>
    </div>
    <script>
        const entries = [{"title": "Aktuelle Updates aus der Medienwelt.", "is_ai": true, "url": "#"}, {"title": "\"ZDF Magazin Royale\" vor dem Aus: Jan B\u00f6hmermann erkl\u00e4rt seine \"furchtbare Entscheidung\"", "url": "https://www.netzwelt.de/news/259034-zdf-magazin-royale-jan-boehmermann-erklaert-furchtbare-entscheidung.html", "source": "netzwelt"}, {"title": "\"Geteert und gefedert durchs Land gejagt\": Lola Weippert und Bettina Tietjen brechen Lanze f\u00fcr Fynn Kliemann", "url": "https://news.google.com/rss/articles/CBMi_gFBVV95cUxNRGZ3OGt2bVpLbFh0Y1dFNjhGa0FCTTBrYTh2ZWliUkdZQmo0cEdzQXVLVXVlY3VZSjZSMnZjQVpxSUFSMUM2ZWxwbWtfc0x1cnlVRDRadlY1aGo1LW1sa04wUDV1YTVxaFhyUW04R1FoRU1EbjNTS0RUWEsyQ0hvUEx2SmZ6OVVfQ1U3V29feTc5VXRndmNEMldITTZBUk1mX054UFQ1Q3lGSkpQRkp3VnZsOW5FejlfckViOFJkRG1UVjN2WUh3RlFvOV85V05zbmtpQXZNZUZCSm5Bb0JCampkQlM3MEtlaHIzX052WGhKV2pwYjNmTHlTdEZ2QQ?oc=5", "source": "TAG24"}, {"title": "Aus diesem Grund m\u00f6chte Fynn Kliemann keine eigenen Kinder", "url": "https://news.google.com/rss/articles/CBMiqgFBVV95cUxPdTZhbnRha1ByRTI2ZU1EU2dob215WEdrRXVIWGRzaE40ejdXOHhIbXRRelBFODFzaWJRSi1maTBLVGNuUzFpaUdzeWIzdVZESTF2eWZlem94a3dTUEdseXB3ZGp6bmtaRDhIc1FPSWVTUUF0RnhaX3BmVHJrMjU5ZDNZQWIzTUR4dTZqVzM3U0lJTHJaUUJmM0FabjhNNHJIa3o4SzA3aTNLQQ?oc=5", "source": "Promiflash"}, {"title": "Ist das der Grund f\u00fcr das Liebes-Aus mit Franzi? Fynn Kliemann will keine Kinder", "url": "https://news.google.com/rss/articles/CBMilwFBVV95cUxOZkZIendfZ1pZMlFIeVFWMm1mbGlEZ2lmYjl2NmJ4QU04VTd5YkhaYkI5aGxwQUc0b1FoTkNJZ1cyS3p1Um5mLWxDMGF0X2YyZEpVS215TXVuVDJOMlQySTJsMG1pWjVQN0VJUm91ZjFYUkJoQzMzS1Ryc2pTS2NvNTJSX0E3MFplSVg3SVlJU0pydE45UVVn?oc=5", "source": "Berliner Kurier"}, {"title": "Aus panischer Angst: Fynn Kliemann gibt Clueso, Marteria und Olli Schulz einen Korb", "url": "https://news.google.com/rss/articles/CBMi3AFBVV95cUxNdmRQY3hXVjBvQnVPNms5LV9zMDFtN21OYnFiX3NnVE1hS1U2dFRTRVVwc2M0eHA1VkFKWEdQRnRLVFlqaGp6SWtJeGd5d2xmNERKLTNVT1hKN3RLY2RjZVY0OGgyS1dIVmFMLTZnTnNSUFpUU3p2Y25ad1         const updateTime = 1792366454072.9202; 
        let currentIndex = 0;
        const box = document.getElementById('content-container');
        const status = document.getElementById('status');
        const bar = document.getElementById('progress-bar');
        const h1 = document.getElementById('h1');
        const h2 = document.getElementById('h2');

        setInterval(() => {
            if(h1.classList.contains('active')) { h1.classList.remove('active'); h2.classList.add('active'); }
            else { h2.classList.remove('active'); h1.classList.add('active'); }
        }, 4000);

        function getTimeAgo() {
            const diff = Math.floor((Date.now() - updateTime) / 60000);
            if (diff < 1) return "Gerade eben";
            return `Vor ${diff} Min.`;
        }

        function showNext() {
            const entry = entries[currentIndex];
            bar.style.animation = 'none'; 
            bar.offsetHeight; 
            bar.style.animation = 'progress 4s linear forwards';
            
            const timeLabel = getTimeAgo();
            status.innerText = entry.is_ai ? `KI-Fokus | ${timeLabel}` : `${entry.source} | ${timeLabel}`;
            
            if (entry.url && entry.url !== "#") {
                box.innerHTML = `<a href="${entry.url}" target="_blank" class="news-text">${entry.title}</a>`;
            } else {
                box.innerHTML = `<p class="news-text">${entry.title}</p>`;
            }
            
            currentIndex = (currentIndex + 1) % entries.length;
        }

        setInterval(showNext, 4000);
        showNext();
    </script>
</body>
</html>
